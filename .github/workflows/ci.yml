name: Data contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: test -c /dev/fuse || sudo modprobe fuse
      - run: npm run sandbox:build
      - run: npm run test:sandbox
  assembler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/assembler-build.ts
      - run: |
          ASSEMBLER_IMAGE="local@$(docker image inspect nba-agent-assembler:local --format '{{.Id}}')" npx tsx --test test/policy-sandbox.test.ts test/starter.test.ts
      - name: Offline chronological launcher and baselines
        run: |
          assembler_pin="local@$(docker image inspect nba-agent-assembler:local --format '{{.Id}}')"
          npm run launch -- --scripted --memory=M0 --assembler-image="$assembler_pin"
          npm run launch -- --scripted --memory=M3 --assembler-image="$assembler_pin"
          npm run launch -- --scripted --memory=M3 --assembler-image="$assembler_pin"
          npm run launch -- --scripted --mode=baselines --assembler-image="$assembler_pin"
