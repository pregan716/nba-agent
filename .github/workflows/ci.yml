name: Data contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: test -c /dev/fuse || sudo modprobe fuse
      - run: npm run sandbox:build
      - run: npm run test:sandbox
      - name: Forecast arm isolation and code persistence
        run: FORECAST_SANDBOX_IMAGE="local@$(docker image inspect nba-agent-sandbox:local --format '{{.Id}}')" npx tsx --test test/forecast-arms.test.ts
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run projection:build
      - name: Reference projection determinism
        run: PROJECTION_IMAGE="local@$(docker image inspect nba-agent-projection:local --format '{{.Id}}')" npx tsx --test test/reference-projection.test.ts
